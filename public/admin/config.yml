backend:
  name: github
  repo: SendashCode/siames-web
  branch: main
  base_url: https://ejy9ebaavl.execute-api.us-east-1.amazonaws.com
  auth_endpoint: auth

publish_mode: simple

media_folder: "public/imagenes"
public_folder: "/imagenes"

collections:
  - name: "usos"
    label: "Usos"
    folder: "content/usos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Resumen", name: "excerpt", widget: "text" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "encuentros"
    label: "Encuentros"
    folder: "content/encuentros"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Resumen", name: "excerpt", widget: "text" }
      - { label: "Contenido", name: "body", widget: "markdown" }
